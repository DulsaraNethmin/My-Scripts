# GoReleaser — https://goreleaser.com
#
# Local dry run:  make snapshot      (builds all six targets into dist/, no publish)
# Config check:   make release-check
# Real release:   push a tag; .github/workflows/release.yml does the rest.
#
# A spinup release is a single file. The stack catalog is compiled into the
# binary by //go:embed in main.go, so the archives must NOT ship stacks/ —
# see the `archives.files` note below.

version: 2
project_name: spinup

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: spinup
    main: .
    binary: spinup
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The same ldflags the Makefile uses, so `spinup version` reads the same
    # whether the binary was built locally or by a release. The v is added back
    # because GoReleaser strips it from the tag, while the Makefile's
    # `git describe` keeps it — and `spinup update` in Phase 3.3 compares what
    # the binary prints against the tag names on the releases page.
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    # Reproducible builds: stamp binaries with the commit time, not build time.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: spinup
    ids:
      - spinup
    # spinup_1.1.0_darwin_arm64.tar.gz — no leading v, lowercase os/arch, so
    # install.sh can build the name from `uname -s | tr A-Z a-z` and `uname -m`.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default file list would be fine today but the point
    # is that this list is the whole archive: one binary plus paperwork. The
    # catalog lives inside the binary; shipping stacks/ beside it would give
    # users a second, staler copy of what `spinup up` already has.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing over the checksum file: sign that one artifact and every
# archive is covered by it. Uses the release workflow's GitHub OIDC token
# (permissions: id-token: write), so there is no private key to keep.
#
# This pipe is NOT skipped by snapshot mode — `make snapshot` passes
# --skip=sign so a local build does not need cosign or an OIDC token.
#
#   cosign verify-blob \
#     --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github\.com/DulsaraNethmin/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    output: true

# ---------------------------------------------------------------- packages
# Both of these push a manifest to a repository of the user's that is not this
# one, which the workflow's GITHUB_TOKEN cannot write to — they use a PAT from
# the TAP_GITHUB_TOKEN secret instead. See docs/RELEASING.md for creating the
# two repositories and the token; until they exist, a tag would fail here after
# the release itself is already published.

# macOS. A cask rather than a formula because GoReleaser deprecated `brews` in
# favour of `homebrew_casks` (and `goreleaser check` fails on it), and because
# Homebrew now wants pre-built binaries shipped as casks. Casks are macOS-only,
# so Linux gets the archives and install.sh instead of the tap.
homebrew_casks:
  - name: spinup
    ids:
      - spinup
    binaries:
      - spinup
    repository:
      owner: DulsaraNethmin
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/DulsaraNethmin/spinup
    description: Start local development services — databases, queues, GUIs, dev tooling — with one command
    license: MIT
    commit_author:
      name: DulsaraNethmin
      email: dulsaranethmin@gmail.com
    commit_msg_template: "spinup {{ .Tag }}"
    # The binaries are not notarized, so without this macOS quarantines the
    # download and Gatekeeper refuses to run it — the user sees "cannot be
    # opened because the developer cannot be verified" on their first spinup.
    #
    # This has to be `pre`, not `post`. Homebrew sorts cask artifacts
    # (Cask::Artifact::AbstractArtifact.sort_order) as PreflightSteps ... Binary
    # ... GeneratedCompletion, PostflightSteps — so generate_completions_from_
    # executable below runs the binary *before* a postflight hook could
    # unquarantine it. Gatekeeper then blocks that exec during `brew install`
    # itself, and the quarantine strip never happens.
    hooks:
      pre:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/spinup"]
          end
    # Homebrew generates the completion scripts by running the binary it just
    # installed, so `spinup up <tab>` works after a brew install with nothing
    # for the user to source.
    generate_completions_from_executable:
      executable: spinup
      args:
        - completion
      shells:
        - bash
        - zsh
        - fish

    # `brew uninstall` leaves ~/.spinup alone — it holds the user's stacks and
    # env files. `brew uninstall --zap` is the one that says to delete it.
    zap:
      trash:
        - ~/.spinup
    caveats: |
      spinup drives Docker, so Docker with Compose v2 has to be running:

        spinup doctor     check the setup
        spinup list       the stack catalog
        spinup up postgres

# Windows.
scoops:
  - name: spinup
    ids:
      - spinup
    repository:
      owner: DulsaraNethmin
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/DulsaraNethmin/spinup
    description: Start local development services — databases, queues, GUIs, dev tooling — with one command
    license: MIT
    commit_author:
      name: DulsaraNethmin
      email: dulsaranethmin@gmail.com
    commit_msg_template: "spinup {{ .Tag }}"
    post_install:
      - "Write-Host 'spinup needs Docker Desktop with Compose v2 running. Check it with: spinup doctor'"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Stacks
      regexp: '^.*?stack(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - "^merge:"
      - "^Merge "

release:
  # Owner and repo are taken from the git remote on purpose: hardcoding a name
  # here would fail the release the day the owner or the repository changed —
  # as it did when My-Scripts became spinup.
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ## Install

    ```sh
    # macOS / Linux — Homebrew
    brew install DulsaraNethmin/tap/spinup

    # Windows — Scoop
    scoop bucket add DulsaraNethmin https://github.com/DulsaraNethmin/scoop-bucket
    scoop install spinup
    ```

    Or download the archive for your platform below, unpack it and put `spinup`
    on your `PATH`. The stack catalog is inside the binary — nothing else to
    install.

    **Verifying a download**

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github\.com/DulsaraNethmin/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```
