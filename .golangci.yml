# golangci-lint v2 configuration. CI pins the same version (.github/workflows/ci.yml);
# locally, `make lint` runs it if it is installed.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # spinup writes to stdout/stderr and cannot do anything useful about a
      # failed write — a closed pipe is the caller's business, and reporting it
      # would turn `spinup version | head` into an error.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DulsaraNethmin/spinup
