# The site is assembled by scripts/build-docs.sh from the markdown already in
# the repository — README, CONTRIBUTING, docs/ and every stack's README — so
# nothing here is a second copy of anything. `make docs` builds it.
site_name: spinup
site_description: Start local development services with one command
site_url: https://dulsaranethmin.github.io/spinup/
repo_url: https://github.com/DulsaraNethmin/spinup
repo_name: DulsaraNethmin/spinup
edit_uri: ""

docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Catalog:
      - Every stack: stacks/index.md
      - adminer: stacks/adminer.md
      - clickhouse: stacks/clickhouse.md
      - couchdb: stacks/couchdb.md
      - kafka: stacks/kafka.md
      - keycloak: stacks/keycloak.md
      - localstack: stacks/localstack.md
      - mailpit: stacks/mailpit.md
      - mariadb: stacks/mariadb.md
      - minio: stacks/minio.md
      - mongodb: stacks/mongodb.md
      - monitoring: stacks/monitoring.md
      - mssql: stacks/mssql.md
      - mysql: stacks/mysql.md
      - nats: stacks/nats.md
      - neo4j: stacks/neo4j.md
      - nginx-proxy-manager: stacks/nginx-proxy-manager.md
      - nginx-static: stacks/nginx-static.md
      - opensearch: stacks/opensearch.md
      - portainer: stacks/portainer.md
      - postgres: stacks/postgres.md
      - pytorch: stacks/pytorch.md
      - rabbitmq: stacks/rabbitmq.md
      - redis: stacks/redis.md
      - traefik: stacks/traefik.md
      - vault: stacks/vault.md
  - Ports: ports.md
  - Contributing: contributing.md
  - Design: design.md
  - Releasing: releasing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
