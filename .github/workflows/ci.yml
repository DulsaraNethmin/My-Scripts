name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- shell

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh setup/*.sh
      - name: scripts are executable
        run: |
          for f in install.sh scripts/*.sh setup/*.sh; do
            [ -x "$f" ] || { echo "$f is not executable"; exit 1; }
          done

      # install.ps1 is the one thing here that cannot be run on Linux, so it is
      # at least parsed and linted. pwsh is preinstalled on GitHub's runners.
      - name: install.ps1 parses and lints
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

          # The analyzer's warnings are printed but not fatal — an installer
          # writes to the console on purpose, which is a warning all by itself.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path ./install.ps1
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host }
          if ($found | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }
          Write-Host "install.ps1 parses"

  # --------------------------------------------------------------- stacks

  lint-stacks:
    name: stack lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/lint-stacks.sh

  # Discover the catalog so adding a stack needs no workflow edit.
  discover:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          json=$(ls -d stacks/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          echo "stacks=$json" >> "$GITHUB_OUTPUT"
          echo "found: $json"

  config:
    name: compose config
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.discover.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          docker compose -f "stacks/${{ matrix.stack }}/compose.yaml" \
            --env-file "stacks/${{ matrix.stack }}/.env.example" config -q
      - name: validate every declared profile
        run: |
          profiles=$(docker compose -f "stacks/${{ matrix.stack }}/compose.yaml" config --profiles || true)
          for p in $profiles; do
            echo "-- profile $p"
            docker compose -f "stacks/${{ matrix.stack }}/compose.yaml" \
              --env-file "stacks/${{ matrix.stack }}/.env.example" --profile "$p" config -q
          done

  smoke:
    name: smoke (${{ matrix.stack }})
    needs: lint-stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The light stacks. mssql (2.3 GB, slow start) and pytorch (6 GB) are
        # deliberately excluded — they would dominate CI time for little signal.
        include:
          - { stack: postgres,            profiles: "--profile gui" }
          - { stack: mysql,               profiles: "--profile gui" }
          - { stack: mongodb,             profiles: "--profile gui" }
          - { stack: redis,               profiles: "--profile gui" }
          - { stack: nginx-static,        profiles: "" }
          - { stack: nginx-proxy-manager, profiles: "" }
          # These three serve their own web interface from the primary
          # container, so they have no gui profile to select.
          - { stack: mailpit,             profiles: "" }
          - { stack: minio,               profiles: "" }
          - { stack: adminer,             profiles: "" }
          - { stack: mariadb,             profiles: "--profile gui" }
          - { stack: rabbitmq,            profiles: "" }
          - { stack: nats,                profiles: "" }
          # Same again: Fauxton, Neo4j Browser and Portainer are all served by
          # the primary container. couchdb and portainer each also start a
          # one-shot setup container, which `--wait` treats as satisfied once
          # it exits 0 and `ps` stops listing.
          - { stack: couchdb,             profiles: "" }
          - { stack: neo4j,               profiles: "" }
          - { stack: portainer,           profiles: "" }
          # ClickHouse's Play and Vault's UI are likewise served by the primary
          # container; localstack has no web interface to serve at all.
          - { stack: clickhouse,          profiles: "" }
          - { stack: localstack,          profiles: "" }
          - { stack: vault,               profiles: "" }
          # traefik's dashboard is its own; kafka-ui is a container of its own
          # and so goes behind the gui profile like the other separate GUIs.
          - { stack: traefik,             profiles: "" }
          - { stack: kafka,               profiles: "--profile gui" }
          - { stack: keycloak,            profiles: "" }
          - { stack: monitoring,          profiles: "--profile gui" }
          # opensearch without its GUI: the two images together are about
          # 3.5 GB, and the broker half is what can actually fail to start.
          - { stack: opensearch,          profiles: "" }
    steps:
      - uses: actions/checkout@v4

      - name: up and wait for healthy
        working-directory: stacks/${{ matrix.stack }}
        run: |
          docker compose --env-file .env.example ${{ matrix.profiles }} \
            up -d --build --wait --wait-timeout 300

      - name: every container is healthy or running
        working-directory: stacks/${{ matrix.stack }}
        run: |
          docker compose --env-file .env.example ${{ matrix.profiles }} ps
          bad=$(docker compose --env-file .env.example ${{ matrix.profiles }} ps \
                  --format json | jq -r 'select(.Health == "unhealthy") | .Name')
          if [ -n "$bad" ]; then echo "unhealthy: $bad"; exit 1; fi

      - name: data survives down but not down -v
        working-directory: stacks/${{ matrix.stack }}
        run: |
          docker compose --env-file .env.example ${{ matrix.profiles }} down
          before=$(docker volume ls -q | grep -c "^spinup-${{ matrix.stack }}_" || true)
          if [ "$before" -eq 0 ]; then
            echo "note: stack declares no volumes"
          else
            echo "volumes kept after down: $before"
          fi
          docker compose --env-file .env.example ${{ matrix.profiles }} down -v
          after=$(docker volume ls -q | grep -c "^spinup-${{ matrix.stack }}_" || true)
          if [ "$after" -ne 0 ]; then echo "down -v left $after volume(s)"; exit 1; fi

      - name: logs on failure
        if: failure()
        working-directory: stacks/${{ matrix.stack }}
        run: docker compose --env-file .env.example ${{ matrix.profiles }} logs --tail 100

  # ------------------------------------------------------------------- go

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      # The catalog is embedded, so this also proves stacks/ compiles into every
      # binary GoReleaser will produce in Phase 3.
      - name: cross-compile every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/arm64; do
            echo "-- $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
          done

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # ------------------------------------------------------------- release
  # The release config is only exercised on a tag, which is exactly when a
  # mistake in it is most expensive. `goreleaser check` parses it on every push.

  release-config:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # ---------------------------------------------------------- integration
  # The tests that need a docker daemon: they bring redis up through the
  # compose wrapper and through the CLI itself, and check that `down` keeps
  # data while `destroy` removes it.

  integration:
    name: integration
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -race, like `make test-integration`: the CLI test drives compose through
      # a single buffer, which is exactly the shape that hid a write race in
      # internal/compose until the race detector was pointed at it.
      - name: go test -tags integration
        run: go test ./... -race -tags integration -count=1 -timeout 15m
