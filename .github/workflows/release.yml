name: release

# Tag pushes publish; the manual run is a dry run that builds every target and
# uploads the archives as workflow artefacts without touching the Releases page.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Mint the OIDC token cosign signs the checksum file with (keyless).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from git history and refuses to run
          # on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Everything CI proves on a push is proven again here: a tag can point at
      # a commit that never passed CI.
      - name: test
        run: go test ./... -race -count=1

      - uses: sigstore/cosign-installer@v3

      # Fail before anything is published rather than after: GoReleaser pushes
      # the Homebrew cask and the Scoop manifest to two other repositories, and
      # a missing PAT would only surface once the release itself already exists.
      - name: the tap token is present
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set, so the cask and the Scoop manifest"
            echo "cannot be pushed. docs/RELEASING.md has how to create it."
            exit 1
          fi

      # `a && b || c` is not a ternary. An empty string for `b` is falsy, so the
      # `||` falls through and a tag build silently becomes a snapshot: nothing
      # published, nothing pushed to the tap, and goreleaser still exits 0. Both
      # branches have to be non-empty.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workflow's own token can only write to this repository, so the
          # tap and the bucket need a PAT. One secret feeds both.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Signing is not skipped in snapshot mode, so the manual dry run exercises
      # the cosign path too — with the same workflow identity a tag would use.
      - name: the checksums and their signature verify
        run: |
          cd dist
          sha256sum -c checksums.txt --ignore-missing
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      # The archives must be a single binary plus LICENSE/README/CHANGELOG. The
      # catalog is compiled in, so a stacks/ directory in an archive means the
      # config regressed and users would get a second, staler copy of it.
      - name: archives ship the binary, not the catalog
        run: |
          fail=0
          for a in dist/*.tar.gz; do
            [ -e "$a" ] || continue
            echo "-- $a"
            tar -tzf "$a"
            if tar -tzf "$a" | grep -q '^stacks/'; then
              echo "ERROR: $a ships stacks/"; fail=1
            fi
          done
          for a in dist/*.zip; do
            [ -e "$a" ] || continue
            echo "-- $a"
            unzip -l "$a"
            if unzip -Z1 "$a" | grep -q '^stacks/'; then
              echo "ERROR: $a ships stacks/"; fail=1
            fi
          done
          exit $fail

      - name: the built binary carries the catalog and the version
        run: |
          tar -xzf dist/spinup_*_linux_amd64.tar.gz -C /tmp spinup
          /tmp/spinup version
          /tmp/spinup list

      # Generated whether or not they are pushed, so the dry run proves the cask
      # and the manifest are still produced before a tag depends on them.
      - name: the cask and the scoop manifest were generated
        run: |
          test -f dist/homebrew/Casks/spinup.rb
          test -f dist/scoop/spinup.json
          cat dist/homebrew/Casks/spinup.rb
          cat dist/scoop/spinup.json

      # A tag that publishes nothing is a silent failure — the run is green and
      # the Releases page is empty. Assert the release exists and carries its
      # six archives plus checksums, signature and certificate.
      - name: the tag actually published a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets | length')
          echo "$GITHUB_REF_NAME published $n assets"
          [ "$n" -ge 9 ]

      - name: upload dry-run archives
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: spinup-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
