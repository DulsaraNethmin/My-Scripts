name: spinup-neo4j

services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      # The initial user is always `neo4j` — Neo4j only lets this variable set
      # its password, which has to be at least 8 characters.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-spinuppass}
      # Neo4j Browser reads the Bolt address the server advertises, so this is
      # what makes the "Connect" form right when NEO4J_BOLT_PORT is overridden.
      NEO4J_server_bolt_advertised__address: ":${NEO4J_BOLT_PORT:-7687}"
      NEO4J_server_http_advertised__address: ":${NEO4J_BROWSER_PORT:-8091}"
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      # Neo4j Browser, served by the database itself. 8091 on the host: 7474 is
      # not in the catalog's 80xx GUI range.
      - "${NEO4J_BROWSER_PORT:-8091}:7474"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # LOAD CSV reads from here: `LOAD CSV FROM 'file:///people.csv' AS row`.
      - ./import:/import:ro
    healthcheck:
      # The HTTP port comes up after Bolt does, so this covers both. The image
      # is Debian-based: it has wget and no curl.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  neo4j-data:
  neo4j-logs:
