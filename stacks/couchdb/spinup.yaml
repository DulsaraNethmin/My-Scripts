name: couchdb
description: Apache CouchDB 3 with the Fauxton web GUI
category: database
primary: couchdb
cli: curl -s http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@127.0.0.1:5984/_all_dbs
gui:
  service: couchdb
  url: http://localhost:${COUCHDB_PORT}/_utils
  login: ${COUCHDB_USER} / ${COUCHDB_PASSWORD}
url: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@localhost:${COUCHDB_PORT}
ports:
  - name: COUCHDB_PORT
    default: 5984
