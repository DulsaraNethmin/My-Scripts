name: spinup-traefik

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      # The dashboard, unauthenticated, on its own entrypoint. That is a local
      # -only setting and the reason this stack must not be exposed.
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      # Routes come from container labels. exposedByDefault=false means a
      # container is routed only when it asks to be.
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entryPoints.web.address=:80"
      - "--accesslog=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      # 8098, not 80: the nginx-proxy-manager stack owns 80, and on Linux
      # binding it needs root. Routed URLs carry the port —
      # http://whoami.localhost:8098.
      - "${TRAEFIK_HTTP_PORT:-8098}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8092}:8080"
    volumes:
      # Read-only: Traefik only ever reads container labels through it.
      - ${TRAEFIK_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      # Traefik's own client against the /ping endpoint --ping turns on.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # The example route, so `spinup up traefik` proves itself: an echo server
  # reachable only through the proxy. Delete it once you have something of
  # your own — nothing else depends on it.
  whoami:
    image: traefik/whoami:v1.11
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
    depends_on:
      traefik:
        condition: service_healthy
