name: kafka
description: Apache Kafka 4 in KRaft mode, with kafka-ui
category: messaging
primary: kafka
cli: /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
gui:
  service: kafka-ui
  url: http://localhost:${KAFKA_UI_PORT}
  login: none
url: localhost:${KAFKA_PORT}
ports:
  - name: KAFKA_PORT
    default: 9092
  - name: KAFKA_UI_PORT
    default: 8093
profiles: [gui]
