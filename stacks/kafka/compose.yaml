name: spinup-kafka

services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # KRaft: this one node is both the broker and the controller, so there
      # is no ZooKeeper. That is the whole reason a single-node Kafka is one
      # container now instead of two.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners, because a broker tells every client where to
      # reconnect and the right answer differs by where the client is.
      # Containers on this network are told `kafka:9092`; anything on your
      # machine is told `localhost:<published port>`.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One node cannot replicate to anywhere, so every built-in topic has to
      # be told to stop asking for three copies.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      # Zero, not the three-second default: locally a consumer joining a group
      # should not wait for a rebalance window that exists to batch up a fleet.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The broker's own client, which proves it is answering the protocol and
      # not merely listening. It starts a JVM, hence the unhurried interval.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [gui]
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local}
      # The in-network listener, not the published one: this container is on
      # the stack's network.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Lets you add topics and clusters from the UI rather than only read.
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8093}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  kafka-data:
