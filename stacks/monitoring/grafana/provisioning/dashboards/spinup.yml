# Loads every dashboard JSON in /var/lib/grafana/dashboards, which the stack
# mounts from grafana/dashboards/. Drop a file in there and it appears.
apiVersion: 1

providers:
  - name: spinup
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
