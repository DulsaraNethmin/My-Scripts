name: spinup-minio

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    # The console is a second listener in the same process, on its own port.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spinup}
      # MinIO refuses to start with a password shorter than 8 characters, so
      # this one is not the catalog's usual "spinup".
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spinup-secret}
      # Printed by the console's login page in older releases; harmless, and it
      # stops the browser tab from being called "MinIO Console" on every stack.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_URL:-http://localhost:8086}
      # Credentials for the `local` alias mc uses inside the container. The
      # image defines that alias without any, which is enough for the
      # healthcheck below and not enough to list a bucket, so `spinup cli minio`
      # would answer "Access Denied" without this.
      MC_HOST_local: http://${MINIO_ROOT_USER:-spinup}:${MINIO_ROOT_PASSWORD:-spinup-secret}@127.0.0.1:9000
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8086}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # mc ships inside the server image with a `local` alias already pointing
      # at it, which makes this the only probe that needs no credentials.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  minio-data:
