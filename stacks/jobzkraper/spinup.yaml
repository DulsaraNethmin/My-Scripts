name: jobzkraper
description: Jobzkraper — job postings scraped into a reviewable queue, twice a day
category: tooling
primary: jobzkraper
# A worker: binds no host port, so there is no url and no ports — the CLI is
# the way in. The image's venv is not on PATH (until its v0.1.1), hence the
# absolute path.
worker: true
cli: /app/.venv/bin/jobscraper
