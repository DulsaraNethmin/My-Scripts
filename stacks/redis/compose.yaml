name: spinup-redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence is off in the stock image. appendonly yes gives durable
    # writes; the old stack had no volume at all and lost everything on stop.
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-spinup}"
    environment:
      # Not read by the server, only by the healthcheck below.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-spinup}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:3.8
    profiles: [gui]
    restart: unless-stopped
    environment:
      # Pre-register the redis service so the UI opens on a live connection.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-spinup}
      RI_REDIS_ALIAS: spinup-redis
    ports:
      - "${REDISINSIGHT_PORT:-8083}:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5540/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  redis-data:
  redisinsight-data:
