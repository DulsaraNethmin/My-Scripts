name: mongodb
description: MongoDB 7 with mongo-express
category: database
primary: mongodb
cli: mongosh -u ${MONGO_USER} -p ${MONGO_PASSWORD} --authenticationDatabase admin ${MONGO_DB}
gui:
  service: mongo-express
  url: http://localhost:${MONGO_EXPRESS_PORT}
  login: ${MONGO_EXPRESS_USER} / ${MONGO_EXPRESS_PASSWORD}
url: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:${MONGO_PORT}/${MONGO_DB}?authSource=admin
ports:
  - name: MONGO_PORT
    default: 27017
  - name: MONGO_EXPRESS_PORT
    default: 8082
profiles: [gui]
